<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Goban board base tile -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#FAF0DA" stroke="#8B5E3C" stroke-width="2.5"/>

  <!-- Goban grid lines (intersecting Go board & chart coordinates) -->
  <line x1="16" y1="10" x2="16" y2="54" stroke="#DEC19D" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="32" y1="10" x2="32" y2="54" stroke="#DEC19D" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="48" y1="10" x2="48" y2="54" stroke="#DEC19D" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="10" y1="16" x2="54" y2="16" stroke="#DEC19D" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="10" y1="30" x2="54" y2="30" stroke="#DEC19D" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="10" y1="44" x2="54" y2="44" stroke="#DEC19D" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Chart volume bars -->
  <rect x="11.5" y="44" width="9" height="9" rx="2.5" fill="#88C13F" opacity="0.38"/>
  <rect x="27.5" y="30" width="9" height="23" rx="2.5" fill="#88C13F" opacity="0.38"/>
  <rect x="43.5" y="16" width="9" height="37" rx="2.5" fill="#88C13F" opacity="0.38"/>

  <!-- Upward chart trend line -->
  <path d="M 9 49 Q 20 44, 32 30 T 55 12" fill="none" stroke="#78AB32" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Stone 1 (Bottom Left: Black Go Stone) -->
  <ellipse cx="16" cy="46.5" rx="8" ry="2.8" fill="#3D2A1F" opacity="0.25"/>
  <circle cx="16" cy="44" r="8" fill="#221A15" stroke="#110B07" stroke-width="0.8"/>
  <ellipse cx="14" cy="41.5" rx="3.5" ry="2" fill="#4A3D34"/>
  <circle cx="13.5" cy="41" r="1.2" fill="#FFFFFF" opacity="0.65"/>

  <!-- Stone 2 (Middle: White Go Stone) -->
  <ellipse cx="32" cy="32.5" rx="8" ry="2.8" fill="#3D2A1F" opacity="0.25"/>
  <circle cx="32" cy="30" r="8" fill="#FFFFFF" stroke="#5E4537" stroke-width="1.4"/>
  <circle cx="30" cy="28" r="1.4" fill="#FFFFFF"/>

  <!-- Stone 3 (Top Right: Black Go Stone) -->
  <ellipse cx="48" cy="18.5" rx="8" ry="2.8" fill="#3D2A1F" opacity="0.25"/>
  <circle cx="48" cy="16" r="8" fill="#221A15" stroke="#110B07" stroke-width="0.8"/>
  <ellipse cx="46" cy="13.5" rx="3.5" ry="2" fill="#4A3D34"/>
  <circle cx="45.5" cy="13" r="1.2" fill="#FFFFFF" opacity="0.65"/>
</svg>